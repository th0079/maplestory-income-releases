name: Sync Release Pages

on:
  release:
    types: [published, released, edited]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync GitHub Pages with latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/sync-pages.mjs

      - name: Commit and push if updated
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -z "$(git status --porcelain docs/ README.md)" ]]; then
            echo "No changes to commit."
            exit 0
          fi
          VERSION_TAG="$(node -e "const fs=require('fs');const m=fs.readFileSync('docs/index.html','utf8').match(/maple-release-version[^>]*content=['\"]([^'\"]+)/);console.log(m?m[1]:'latest')")"
          git add docs/ README.md
          git commit -m "docs: ${VERSION_TAG} 릴리스 정보 자동 동기화"
          git pull --rebase origin main
          git push origin main
